<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>赤城カード対戦</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0c0f12; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; touch-action: none; }
    
    .screen { display: none; width: 100vw; height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* モード選択画面 */
    #modeScreen { justify-content: center; align-items: center; background: radial-gradient(circle, #1a0000 0%, #050000 100%); }
    .title-logo { font-size: 32px; font-weight: bold; color: #ff3333; text-shadow: 0 0 15px #ff0000; margin-bottom: 25px; letter-spacing: 4px; text-align: center; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; width: 300px; }
    .btn { padding: 12px; background: #1a232a; border: 1px solid #ff3333; color: #fff; font-weight: bold; font-size: 14px; border-radius: 4px; cursor: pointer; text-align: center; transition: 0.2s; }
    .btn:hover { background: #ff3333; color: #000; box-shadow: 0 0 10px #ff0000; }
    
    .rank-box { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
    .room-input { padding: 8px; background: #000; border: 1px solid #ff3333; color: #ff8c00; font-weight: bold; text-align: center; border-radius: 4px; font-size: 14px; }
    .input-label { font-size: 11px; color: #aaa; text-align: center; }

    /* ロビー画面 */
    #lobbyScreen { justify-content: center; align-items: center; background: #111; }
    .loading-spinner { width: 45px; height: 45px; border: 4px solid #333; border-top: 4px solid #ff3333; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* カスタム編成画面 */
    #customScreen { background: #12161a; padding: 15px; flex-direction: column; }
    .custom-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
    .deck-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
    .slot-box { background: #1e2530; border: 1px dashed #4a5c6e; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; min-height: 80px; font-size: 11px; }
    .slot-box.filled { border-style: solid; border-color: #ff3333; background: #2a1515; }
    .card-pool { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; border-top: 1px solid #333; }
    .card-item { min-width: 100px; height: 110px; background: #222b35; border: 1px solid #4a5c6e; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; font-size: 10px; }
    .card-item:hover { border-color: #00ffcc; }

    /* 戦闘画面 */
    #battleScreen { flex-direction: column; }
    #header { height: 40px; background: #1a0000; border-bottom: 2px solid #8b0000; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
    #title { font-weight: bold; font-size: 15px; color: #ff3333; }
    #canvas { flex: 1; background: radial-gradient(circle, #1a232a 0%, #0d1216 100%); cursor: crosshair; }
    #uiPanel { height: 130px; background: #14171a; border-top: 2px solid #333; display: flex; flex-direction: column; align-items: center; padding: 8px; }
    #manaContainer { width: 90%; height: 12px; background: #222; border: 1px solid #444; border-radius: 6px; overflow: hidden; margin-bottom: 8px; position: relative; }
    #manaFill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff8c00, #ff0055); }
    #manaText { position: absolute; width: 100%; text-align: center; font-size: 9px; line-height: 12px; font-weight: bold; }
    #cardDeck { display: flex; gap: 10px; }
    .battle-card { width: 85px; height: 90px; background: #222b35; border: 2px solid #4a5c6e; border-radius: 6px; padding: 5px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; }
    .battle-card.selected { border-color: #ff3333; background: #3d2222; box-shadow: 0 0 10px rgba(255,51,51,0.5); }

    /* 5. カード排出（リザルト）画面 */
    #rewardScreen { justify-content: center; align-items: center; background: radial-gradient(circle, #1c2630 0%, #090c0f 100%); }
    .result-title { font-size: 28px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 10px #ffaa00; margin-bottom: 20px; }
    
    .dispenser-container { position: relative; width: 180px; height: 250px; perspective: 1000px; margin-bottom: 25px; }
    .dispenser-card { width: 100%; height: 100%; background: linear-gradient(135deg, #2b3847 0%, #151c24 100%); border: 3px solid #ffcc00; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-shadow: 0 0 25px rgba(255, 204, 0, 0.4); text-align: center; transform-style: preserve-3d; transition: transform 0.8s; }
    .dispenser-card.face-down { background: repeating-linear-gradient(45deg, #1f2937, #1f2937 10px, #111827 10px, #111827 20px); border-color: #4a5c6e; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
    .dispenser-card.face-down * { display: none; }
  </style>
</head>
<body>

  <!-- 1. モード選択画面 -->
  <div id="modeScreen" class="screen active">
    <div class="title-logo">赤城カード対戦</div>
    <div class="btn-group">
      <div class="btn" onclick="openDeckCustom()">作戦部隊編成</div>
      
      <div class="rank-box">
        <div class="input-label">【 部屋番号指定ランクマッチ 】<br>※未入力の場合は全プレイヤーからフリー対戦</div>
        <input type="text" id="rankRoomInput" class="room-input" placeholder="部屋番号を入力 (任意4桁)" maxlength="4">
        <div class="btn" style="background:#8b0000;" onclick="startRankMatch()">ランクマッチ開始</div>
      </div>
    </div>
  </div>

  <!-- 2. マッチング待ちロビー画面 -->
  <div id="lobbyScreen" class="screen">
    <div class="loading-spinner"></div>
    <div id="lobbyStatus" style="font-size: 16px; font-weight: bold; text-align: center; line-height: 1.5;"></div>
    <div style="margin-top: 25px;" class="btn" onclick="cancelMatching()">検索キャンセル</div>
  </div>

  <!-- 3. カスタム編成画面 -->
  <div id="customScreen" class="screen">
    <div class="custom-header">
      <h2>作戦部隊編成</h2>
      <div>総コスト: <span id="totalCapDisplay" style="color:#ff8c00; font-weight:bold;">0</span> / 10</div>
    </div>
    <div class="deck-slots">
      <div class="slot-box" id="slot-unit" onclick="selectSlotType('units')">【機体カード】<br><span id="slot-unit-name">未設定</span></div>
      <div class="slot-box" id="slot-tactic" onclick="selectSlotType('tactics')">【作戦カード】<br><span id="slot-tactic-name">未設定</span></div>
      <div class="slot-box" id="slot-weapon" onclick="selectSlotType('weapons')">【兵装カード】<br><span id="slot-weapon-name">未設定</span></div>
    </div>
    <div style="font-size: 12px; color: #888; margin-bottom: 5px;" id="poolCategoryTitle">選択可能なカード</div>
    <div class="card-pool" id="cardPool"></div>
    <div style="margin-top: auto; display: flex; gap: 10px;">
      <div class="btn" style="flex:1" onclick="showScreen('modeScreen')">戻る</div>
      <div class="btn" style="flex:1; background:#008855; border-color:#00ffcc;" onclick="saveDeck()">編成完了</div>
    </div>
  </div>

  <!-- 4. 戦闘画面 -->
  <div id="battleScreen" class="screen">
    <div id="header">
      <div id="title">赤城カード対戦 - BATTLE</div>
      <div id="battleStatus" style="font-size: 12px; color: #aaa;">交戦中</div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="uiPanel">
      <div id="manaContainer">
        <div id="manaFill"></div>
        <div id="manaText">戦術ゲージ (CAP)</div>
      </div>
      <div id="cardDeck"></div>
    </div>
  </div>

  <!-- 5. カード排出（リザルト）画面 -->
  <div id="rewardScreen" class="screen">
    <div class="result-title" id="resultTitle">作戦完了！</div>
    <div style="font-size: 13px; color: #aaa; margin-bottom: 15px;">戦果報酬：新規カード1枚排出</div>

    <div class="dispenser-container">
      <div class="dispenser-card face-down" id="rewardCard">
        <div id="rewardCategory" style="font-size: 11px; color: #ff8c00; font-weight: bold;"></div>
        <div id="rewardName" style="font-size: 16px; font-weight: bold; margin: 15px 0;"></div>
        <div id="rewardCap" style="font-size: 12px; color: #00ffcc;"></div>
        <div id="rewardDesc" style="font-size: 11px; color: #bbb; text-align: left; margin-top: 10px;"></div>
      </div>
    </div>

    <div class="btn" id="claimBtn" style="width: 200px; background: #ff8c00; border-color: #ffaa00;" onclick="revealCard()">カードを排出する</div>
  </div>

  <!-- 外部カードマスターデータの読み込み -->
  <script src="cards-data.js"></script>

  <!-- メインJSロジック -->
  <script>
    let myDeck = { unit: null, tactic: null, weapon: null };
    let activeSlotType = 'units';
    let mana = 0, selectedCard = null;
    let units = [], enemies = [];
    let selectedUnit = null, isDragging = false;
    let droppedCard = null;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function openDeckCustom() {
      showScreen('customScreen');
      selectSlotType('units');
    }

    function selectSlotType(type) {
      activeSlotType = type;
      const titles = { units: '選択可能: 機体カード', tactics: '選択可能: 作戦カード', weapons: '選択可能: 兵装カード' };
      document.getElementById('poolCategoryTitle').textContent = titles[type];
      
      const pool = document.getElementById('cardPool');
      pool.innerHTML = '';
      CARD_DATABASE[type].forEach(card => {
        const item = document.createElement('div');
        item.className = 'card-item';
        item.innerHTML = `<div><strong>${card.name}</strong></div><div style="color:#ff8c00">CAP: ${card.cap}</div><div style="color:#aaa">${card.desc}</div>`;
        item.onclick = () => equipCard(type, card);
        pool.appendChild(item);
      });
    }

    function equipCard(type, card) {
      const typeKeyMap = { units: 'unit', tactics: 'tactic', weapons: 'weapon' };
      myDeck[typeKeyMap[type]] = card;
      document.getElementById(`slot-${typeKeyMap[type]}-name`).textContent = `${card.name} (CAP:${card.cap})`;
      document.getElementById(`slot-${typeKeyMap[type]}`).classList.add('filled');
      
      const totalCap = (myDeck.unit?.cap || 0) + (myDeck.tactic?.cap || 0) + (myDeck.weapon?.cap || 0);
      document.getElementById('totalCapDisplay').textContent = totalCap;
    }

    function saveDeck() {
      if (!myDeck.unit) { alert('機体カードを選択してください。'); return; }
      alert('作戦部隊の編成を保存しました！');
      showScreen('modeScreen');
    }

    function startRankMatch() {
      const roomNum = document.getElementById('rankRoomInput').value.trim();
      const statusEl = document.getElementById('lobbyStatus');

      if (roomNum !== "") {
        statusEl.innerHTML = `【部屋指定ランクマッチ】<br>部屋番号 [ <span style="color:#ff8c00">${roomNum}</span> ] でマッチング中...`;
      } else {
        statusEl.innerHTML = `【フリーランクマッチ】<br>全国の対戦相手を自動検索中...`;
      }

      showScreen('lobbyScreen');
      setTimeout(() => { initBattle(); }, 2500);
    }

    function cancelMatching() { showScreen('modeScreen'); }

    // 戦闘システム
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let battleAnimationId = null;

    function initBattle() {
      showScreen('battleScreen');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 170;

      const cardDeckUI = document.getElementById('cardDeck');
      cardDeckUI.innerHTML = '';
      
      const activeUnitCard = myDeck.unit || CARD_DATABASE.units[0];
      const activeTacticCard = myDeck.tactic || CARD_DATABASE.tactics[0];
      const activeWeaponCard = myDeck.weapon || CARD_DATABASE.weapons[0];
      const totalCost = activeUnitCard.cap + activeTacticCard.cap + activeWeaponCard.cap;

      const cardEl = document.createElement('div');
      cardEl.className = 'battle-card';
      cardEl.innerHTML = `<div><strong>${activeUnitCard.name}</strong></div><div style="color:#ff8c00">CAP: ${totalCost}</div><div style="font-size:8px;color:#aaa">${activeTacticCard.name}</div>`;
      cardEl.onclick = () => {
        if (mana >= totalCost) {
          selectedCard = { unit: activeUnitCard, tactic: activeTacticCard, weapon: activeWeaponCard, cost: totalCost };
          document.querySelectorAll('.battle-card').forEach(c => c.classList.remove('selected'));
          cardEl.classList.add('selected');
        }
      };
      cardDeckUI.appendChild(cardEl);

      enemies = [{ x: canvas.width / 2, y: 80, angle: Math.PI / 2, hp: 120, maxHp: 120 }];
      units = [];
      mana = 0;
      if (battleAnimationId) cancelAnimationFrame(battleAnimationId);
      battleAnimationId = requestAnimationFrame(updateBattle);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const pos = getPos(e);
      if (selectedCard) {
        let hpVal = selectedCard.unit.hp * (selectedCard.tactic.effect === 'hp' ? selectedCard.tactic.val : 1.0);
        let rangeVal = selectedCard.unit.range * (selectedCard.tactic.effect === 'range' ? selectedCard.tactic.val : 1.0);
        let atkVal = (selectedCard.weapon.atk) * (selectedCard.tactic.effect === 'atk' ? selectedCard.tactic.val : 1.0);

        units.push({
          x: pos.x, y: pos.y, angle: -Math.PI / 2,
          hp: hpVal, maxHp: hpVal, range: rangeVal, atk: atkVal,
          color: selectedCard.unit.color
        });

        mana -= selectedCard.cost;
        selectedCard = null;
        document.querySelectorAll('.battle-card').forEach(c => c.classList.remove('selected'));
        return;
      }
      selectedUnit = units.find(u => Math.hypot(u.x - pos.x, u.y - pos.y) < 25);
      if (selectedUnit) isDragging = true;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging || !selectedUnit) return;
      const pos = getPos(e);
      const dx = pos.x - selectedUnit.x, dy = pos.y - selectedUnit.y;
      if (Math.hypot(dx, dy) > 5) selectedUnit.angle = Math.atan2(dy, dx);
      selectedUnit.x = pos.x;
      selectedUnit.y = pos.y;
    });

    canvas.addEventListener('pointerup', () => { isDragging = false; });

    function updateBattle() {
      if (!document.getElementById('battleScreen').classList.contains('active')) return;

      if (mana < 10) mana += 0.015;
      document.getElementById('manaFill').style.width = (mana / 10 * 100) + '%';
      document.getElementById('manaText').textContent = `戦術ゲージ: ${Math.floor(mana)} / 10`;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

      enemies.forEach(e => {
        ctx.fillStyle = '#ff3333';
        ctx.beginPath(); ctx.arc(e.x, e.y, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#555'; ctx.fillRect(e.x - 20, e.y - 28, 40, 4);
        ctx.fillStyle = '#ff3333'; ctx.fillRect(e.x - 20, e.y - 28, (e.hp / e.maxHp) * 40, 4);
      });

      units.forEach(u => {
        ctx.fillStyle = 'rgba(255, 51, 51, 0.12)';
        ctx.beginPath(); ctx.moveTo(u.x, u.y);
        ctx.arc(u.x, u.y, u.range, u.angle - Math.PI / 6, u.angle + Math.PI / 6);
        ctx.closePath(); ctx.fill();

        ctx.save(); ctx.translate(u.x, u.y); ctx.rotate(u.angle);
        ctx.fillStyle = u.color; ctx.fillRect(-14, -14, 28, 28);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(4, -7); ctx.lineTo(4, 7); ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#555'; ctx.fillRect(u.x - 20, u.y - 25, 40, 4);
        ctx.fillStyle = '#00ffcc'; ctx.fillRect(u.x - 20, u.y - 25, (u.hp / u.maxHp) * 40, 4);

        enemies.forEach(e => {
          const dist = Math.hypot(e.x - u.x, e.y - u.y);
          const diff = Math.abs(Math.atan2(e.y - u.y, e.x - u.x) - u.angle);
          if (dist < u.range && diff < Math.PI / 6) {
            ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(e.x, e.y); ctx.stroke();
            e.hp -= u.atk;
          }
        });
      });

      enemies = enemies.filter(e => e.hp > 0);

      // 敵を撃破して勝利 ➔ カード排出画面へ
      if (enemies.length === 0) {
        setTimeout(() => { finishMatch(true); }, 500);
        return;
      }

      battleAnimationId = requestAnimationFrame(updateBattle);
    }

    // マッチ終了＆排出準備
    function finishMatch(isWin) {
      document.getElementById('resultTitle').textContent = isWin ? '作戦成功！ (VICTORY)' : '作戦失敗 (DEFEAT)';
      
      // ドロップカードをランダム選出
      droppedCard = REWARD_CARD_POOL[Math.floor(Math.random() * REWARD_CARD_POOL.length)];
      
      const cardEl = document.getElementById('rewardCard');
      cardEl.classList.add('face-down');
      
      const btn = document.getElementById('claimBtn');
      btn.textContent = 'カードを排出する';
      btn.onclick = revealCard;

      showScreen('rewardScreen');
    }

    // 排出演出
    function revealCard() {
      const cardEl = document.getElementById('rewardCard');
      
      // 裏返し解除＆表示
      document.getElementById('rewardCategory').textContent = `【 ${droppedCard.category.toUpperCase()} 】`;
      document.getElementById('rewardName').textContent = droppedCard.name;
      document.getElementById('rewardCap').textContent = `CAP: ${droppedCard.cap}`;
      document.getElementById('rewardDesc').textContent = droppedCard.desc;
      cardEl.classList.remove('face-down');

      // 取得カードを所持リスト（CARD_DATABASE）に追加
      const exists = CARD_DATABASE[droppedCard.category].some(c => c.id === droppedCard.id);
      if (!exists) {
        CARD_DATABASE[droppedCard.category].push(droppedCard);
      }

      const btn = document.getElementById('claimBtn');
      btn.textContent = 'タイトルへ戻る';
      btn.onclick = () => showScreen('modeScreen');
    }
  </script>
</body>
</html>
